# System Nginx Reverse Proxy Configuration for monbot.woutils.com
# This file should be placed in /etc/nginx/sites-available/monbot.woutils.com
# Then symlinked to /etc/nginx/sites-enabled/monbot.woutils.com
#
# Installation:
#   sudo cp nginx-reverse-proxy.conf /etc/nginx/sites-available/monbot.woutils.com
#   sudo ln -s /etc/nginx/sites-available/monbot.woutils.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name monbot.woutils.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        proxy_pass http://localhost:5080;
        proxy_set_header Host $host;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monbot.woutils.com;

    # SSL certificates - configure with certbot:
    # sudo certbot --nginx -d monbot.woutils.com
    ssl_certificate /etc/letsencrypt/live/monbot.woutils.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monbot.woutils.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/monbot_access.log;
    error_log /var/log/nginx/monbot_error.log;

    # Proxy to Docker nginx (running on port 5080)
    location / {
        proxy_pass http://localhost:5080;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
